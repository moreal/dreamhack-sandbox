apiVersion: wargame.vm/v1
kind: Profile

# Template. Copy it under your own name before editing:
#   wargame profile init windows-x86_64 --name windows-custom
#   wargame profile create windows-custom --iso /path/to/windows-x64.iso
#   wargame profile console windows-custom   # enable TPM 2.0 + Secure Boot in
#                                            # UTM's QEMU settings, then install
#   wargame profile build windows-custom
#
# You supply the Windows ISO and its licence; wargame installs nothing on
# your behalf and bypasses no installation requirement.

metadata:
  name: windows-x86_64
  description: "Windows 11 x86_64 (UTM, full emulation)"

vm:
  backend: utm
  mode: emulate

guest:
  os: windows
  arch: x86_64
  # Must match the account created during the Windows installation.
  user: wargame

image:
  # UTM has no base images: the source is the installation VM `profile
  # create` makes, and the image is what `profile build` publishes from it.
  base: ""

resources:
  cpu: 4
  memory_gib: 8
  disk_gib: 80

provision:
  scripts:
    - scripts/windows/common.ps1

tools:
  # Each command is argv (no shell, no pipes) and must exit 0 in the guest.
  # Every token reaches the guest as a quoted literal, so each entry has to
  # be a native executable: a PowerShell cmdlet would bind its quoted
  # parameter names as positional values and fail. scripts/windows/common.ps1
  # names the install source for each one.
  verify:
    - powershell -NoProfile -Command $PSVersionTable.PSVersion.ToString()
    - sc.exe query sshd
    - python --version
    - git --version
    - 7z i

workspace:
  root: 'C:\wargame'
