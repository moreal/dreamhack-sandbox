apiVersion: wargame.vm/v1
kind: Profile

metadata:
  name: macos-re-arm64
  description: "macOS reversing: Ghidra, LLVM, Python/uv"

guest:
  os: macos
  arch: arm64
  user: admin
  password: admin # only used while building the profile image (DESIGN.md §5)

image:
  base: ghcr.io/cirruslabs/macos-sequoia-vanilla:latest

resources:
  cpu: 4
  memory_gib: 8
  disk_gib: 60

provision:
  scripts:
    - scripts/macos/common.sh
    - scripts/macos/reversing.sh

tools:
  # Each entry is split on whitespace and run as one argv over SSH (no shell,
  # so no pipes or redirections). PATH comes from the guest's ~/.zshenv.
  verify:
    - python3 --version
    - uv --version
    - test -x /opt/homebrew/bin/ghidraRun
    - java -version
    - which analyzeHeadless
    - llvm-objdump --version
    - which lld
    - hexyl --version

workspace:
  root: /Users/admin/wargame
