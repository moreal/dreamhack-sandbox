apiVersion: wargame.vm/v1
kind: Profile

# Template. Copy it under your own name before editing:
#   wargame profile init kali-arm64 --name kali-custom
#   wargame profile create kali-custom --iso /path/to/kali-arm64-installer.iso
#   wargame profile console kali-custom      # install the OS, prepare SSH
#   wargame profile build kali-custom

metadata:
  name: kali-arm64
  description: "Kali Linux arm64 (UTM, hardware virtualization)"

vm:
  backend: utm
  mode: virtualize

guest:
  os: linux
  distribution: kali
  arch: arm64
  user: kali

image:
  # UTM has no base images: the source is the installation VM `profile
  # create` makes, and the image is what `profile build` publishes from it.
  base: ""

resources:
  # Left as they are on purpose. Note that an emulated guest uses every core
  # it is given: running this profile's install or build at the same time as
  # another VM on the same host makes both crawl (a 10-core host running the
  # two Kali profiles together logged guest soft-lockups and a load average
  # of 24). Do them one at a time, or lower `cpu` here.
  cpu: 4
  memory_gib: 8
  disk_gib: 80

provision:
  scripts:
    - scripts/kali/common.sh

tools:
  # Each command is argv (no shell, no pipes) and must exit 0 in the guest.
  # `wargame profile build` runs them after scripts/kali/common.sh, which
  # names the install source for each one, and only publishes the image when
  # they all pass.
  verify:
    - python3 --version
    - python3 -m pip --version
    - python3 -m venv --help
    - git --version
    - curl --version
    # If the guest's unzip returns non-zero for `-v`, use `unzip -h`
    # (scripts/kali/common.sh has to match).
    - unzip -v
    - file --version
    - gdb --version
    - objdump --version
    - gcc --version
    - make --version

workspace:
  root: /home/kali/wargame
