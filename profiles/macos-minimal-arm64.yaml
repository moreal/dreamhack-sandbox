apiVersion: wargame.vm/v1
kind: Profile

metadata:
  name: macos-minimal-arm64
  description: "macOS minimal: shell utilities, Git, Python/uv"

guest:
  os: macos
  arch: arm64
  user: admin
  password: admin # only used while building the profile image (DESIGN.md §5)

image:
  base: ghcr.io/cirruslabs/macos-sequoia-vanilla:latest

resources:
  cpu: 4
  memory_gib: 8
  disk_gib: 50

provision:
  scripts:
    - scripts/macos/common.sh

tools:
  verify:
    - git --version
    - python3 --version
    - uv --version

workspace:
  root: /Users/admin/wargame
