[workspace]
resolver = "2"
members = [
    "crates/wargame-core",
    "crates/wargame-dreamhack",
    "crates/wargame-tart",
    "crates/wargame-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/moreal/dreamhack-sandbox"
rust-version = "1.85"

[workspace.dependencies]
wargame-core = { path = "crates/wargame-core" }
wargame-dreamhack = { path = "crates/wargame-dreamhack" }
wargame-tart = { path = "crates/wargame-tart" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
secrecy = { version = "0.10", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "serde-well-known"] }
rand = "0.8"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "stream", "gzip"] }
futures-util = "0.3"
url = "2"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
ratatui = "0.29"
crossterm = "0.28"
rpassword = "7"
comfy-table = "7"
libc = "0.2"
percent-encoding = "2"

[profile.release]
strip = true
lto = "thin"
