[changelog]
path = "CHANGELOG.md"
title = "Changelog"
unreleased-heading = "To be released."
materialize = true
region-detection = "marker"

[fragments]
directory = "changes.d"
next-file = "next"

[links]
"#" = "https://github.com/moreal/dreamhack-sandbox/issues/{n}"

[vcs]
preset = "git"

[check]
paths = []
